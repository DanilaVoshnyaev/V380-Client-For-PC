name: Проверка базы устройств

on:
  pull_request:
    paths:
      - "db/**"
      - "tools/validate_db.py"
  push:
    branches: [main]
    paths:
      - "db/**"
      - "tools/validate_db.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Валидация записей
        run: python tools/validate_db.py

      - name: Проверка на личные данные
        run: |
          # В базу не должны попадать конкретные адреса, ID и полные MAC.
          if grep -rInE '([0-9]{1,3}\.){3}[0-9]{1,3}' db/devices/ \
             | grep -vE '\{host\}|0\.0\.0\.0'; then
            echo "Найден IP-адрес в записи базы — уберите его."
            exit 1
          fi
          if grep -rInE '([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}' db/devices/; then
            echo "Найден полный MAC — оставьте только префикс OUI (3 байта)."
            exit 1
          fi
          echo "Личных данных не обнаружено."
