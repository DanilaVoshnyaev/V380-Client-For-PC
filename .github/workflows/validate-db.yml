name: Проверки репозитория

# Проверка приватности касается всего репозитория, а не только базы,
# поэтому фильтра по путям здесь нет: личные данные не должны проскочить
# ни в README, ни в примере команды в docstring.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Валидация записей базы
        run: python tools/validate_db.py

      - name: Проверка адресов для пожертвований
        # Опечатка в криптоадресе необратима, а подмена адреса в постороннем
        # pull request — известный способ увести чужие донаты. Контрольные
        # суммы ловят и то, и другое. Пока DONATE.md нет, шаг просто молчит.
        run: python tools/check_donations.py

      - name: Проверка на личные данные
        run: |
          # Проверяются все файлы под контролем версий, кроме самих workflow:
          # в базу, документацию и примеры в коде не должны попадать адреса
          # и MAC реальных сетей — ни автора, ни приславшего pull request.
          FILES=$(git ls-files -- ':!:.github/workflows/*')

          # Разрешены только адреса из примеров:
          #   192.168.1.x    — условная домашняя сеть, принятая в документации
          #   10.8.0.x       — служебная подсеть туннеля WireGuard
          #   192.0.2.x, 198.51.100.x, 203.0.113.x — RFC 5737, зарезервированы
          #                    как раз для примеров и никому не принадлежат
          #   8.8.8.8 — публичный DNS Google: им определяется свой маршрут
          ALLOWED='(192\.168\.1\.[0-9]{1,3}|10\.8\.0\.[0-9]{1,3}|192\.0\.2\.[0-9]{1,3}|198\.51\.100\.[0-9]{1,3}|203\.0\.113\.[0-9]{1,3}|0\.0\.0\.0|127\.0\.0\.1|8\.8\.8\.8)$'
          if grep -oIHnE '([0-9]{1,3}\.){3}[0-9]{1,3}' $FILES | grep -vE "$ALLOWED"; then
            echo
            echo "Найден IP-адрес вне списка примеров (см. строки выше)."
            echo "Замените его на 192.168.1.100 или на адрес из RFC 5737 (203.0.113.10)."
            exit 1
          fi

          # Полный MAC — это конкретное устройство. Для опознавания модели
          # достаточно префикса OUI: 4C:2F:7B. Маска 4C:2F:7B:XX:XX:XX в
          # примерах вывода допустима — X не является шестнадцатеричной цифрой.
          if grep -IHnE '([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}' $FILES; then
            echo
            echo "Найден полный MAC-адрес (см. строки выше)."
            echo "Оставьте префикс OUI из трёх байт, остальное замените на XX:XX:XX."
            exit 1
          fi

          echo "Личных данных не обнаружено."
